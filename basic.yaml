logger:
  id: logger_component
  level: DEBUG

debug:
  update_interval: 30s

text_sensor:
  - platform: version
    id: esphome_version
    name: ESPHome Version
    entity_category: "diagnostic"
  - platform: debug
    reset_reason:
      id: esphome_reset_reason
      name: "Reset Reason"
      entity_category: "diagnostic"

binary_sensor:
  - platform: status
    id: esphome_status
    name: Status
    device_class: connectivity

sensor:
  - platform: uptime
    id: esphome_uptime
    name: Uptime
    update_interval: 60s
    accuracy_decimals: 0
    icon: mdi:clock-outline
    entity_category: "diagnostic"
